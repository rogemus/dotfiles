# ─── Terminal & keys ───────────────────────────────────────────────
set -as terminal-overrides ",xterm*:Tc"
set -s  extended-keys on
set -as terminal-features ',xterm*:extended-keys'

# ─── General ───────────────────────────────────────────────────────
set -g history-limit 50000
set -g mouse on
set -g focus-events on
setw -g mode-keys vi
set-option -g allow-rename off
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

# ─── Prefix: C-a ───────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ─── Reload config ─────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded ✓"

# ─── Splits & panes ────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind '.' command-prompt -I "select-pane -T "      # rename pane

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# bind-key -n M-w kill-pane

# ─── Windows ───────────────────────────────────────────────────────
bind-key -n M-t new-window -c "#{pane_current_path}"
# bind-key -n M-BTab previous-window
# bind-key -n M-Tab  next-window

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# ─── Fuzzy session switcher (Ctrl+Tab, no prefix) ──────────────────
# Needs in Ghostty config: keybind = ctrl+tab=text:\x1b[27;5;9~
bind -n C-Tab new-pane -E -X 0 -Y 0 -x "75%" -y "40%" \; move-pane -P centre \; switch-mode -ks

# ─── Copy mode ─────────────────────────────────────────────────────
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe "pbcopy"          # mouse: copy and stay
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"           # keyboard: copy and exit
bind -T copy-mode-vi v   send -X begin-selection                           # start selection
bind -T copy-mode-vi C-v send -X rectangle-toggle                          # block selection

# ─── Popups ────────────────────────────────────────────────────────
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% lazygit    # prefix g: lazygit (q to close)

# ─── Bells & activity: all off ─────────────────────────────────────
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# ─── Colors: panes ─────────────────────────────────────────────────
set -g window-style        'fg=default,bg=#000000'
set -g pane-border-style        'fg=#414141'
set -g pane-active-border-style 'fg=#AFFF00'
set -g pane-border-status top
set -g pane-border-format " #T "

# ─── Colors: popups & session switcher ─────────────────────────────
set -g popup-style         'fg=#AFFF00,bg=#000000'
set -g popup-border-style  'fg=#AFFF00,bg=#000000'
set -g tree-mode-border-style 'fg=#AFFF00,bg=#000000'

# ─── Colors: modes & messages ──────────────────────────────────────
setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black bg=red bold'
set -g message-style 'fg=#000000 bg=#AFFF00 bold'

# ─── Status bar ────────────────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#AFFF00'

set -g status-left ''
set -g status-left-length 10
set -g status-right ' #(basename #{pane_current_path}) #[fg=#000000]#[bg=#AFFF00] #S '
set -g status-right-length 50

setw -g window-status-style          'fg=#AFFF00 bg=#000000'
setw -g window-status-format         ' [#I] #[fg=white]#W '
setw -g window-status-current-style  'fg=#000000 bg=#AFFF00'
setw -g window-status-current-format ' [#I] #W '
setw -g window-status-bell-style     'fg=#000000 bg=#AFFF00 bold'
setw -g window-status-separator      ' '